<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حفظ رسومات Software Engineering</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16211d;--mut:#5d6b65;--line:#cfd9d4;--acc:#0f6b57;--accbg:#d9efe8;--ok:#1b8a4b;--bad:#c0392b;--hid:#e6ece9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#18241f;--ink:#e6efeb;--mut:#93a69d;--line:#2c3d36;--acc:#4fd1b0;--accbg:#173a31;--ok:#4ade80;--bad:#f87171;--hid:#22332c}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#18241f;--ink:#e6efeb;--mut:#93a69d;--line:#2c3d36;--acc:#4fd1b0;--accbg:#173a31;--ok:#4ade80;--bad:#f87171;--hid:#22332c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;line-height:1.6}
body{max-width:860px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.88rem;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
button{font:inherit;color:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs button.on,.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .tabs button.on,:root[data-theme="dark"] .chip.on{color:#07261d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on,:root:not([data-theme="light"]) .chip.on{color:#07261d}}
.sel{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{white-space:nowrap;font-size:.85rem;padding:6px 11px;border-radius:99px;direction:ltr}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ttl b{font-size:1.1rem;direction:ltr}
.hint{color:var(--mut);font-size:.85rem}
.flow{direction:ltr;display:flex;flex-direction:column;align-items:center;gap:0;margin:12px 0}
.node{width:min(100%,440px);border:2px solid var(--acc);background:var(--accbg);border-radius:12px;padding:9px 12px;text-align:center;font-weight:600;position:relative}
.node small{display:block;font-weight:400;color:var(--mut);font-size:.8rem}
.node.hid{background:var(--hid);border-style:dashed;color:transparent;cursor:pointer;user-select:none}
.node.hid small{color:transparent}
.node.hid::after{content:"؟ اضغط للإظهار";color:var(--mut);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:.85rem}
.arr{color:var(--acc);font-size:1.3rem;line-height:1.1;height:22px}
.loop{direction:ltr;font-size:.82rem;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;text-align:center}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:.9rem}
.pc div{border-radius:10px;padding:8px 10px;direction:ltr}
.pro{background:color-mix(in srgb,var(--ok) 14%,transparent)}.con{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pc ul{margin:4px 0 0;padding-left:18px}
@media(max-width:520px){.pc{grid-template-columns:1fr}}
.pool{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.pool button{border-color:var(--acc);font-weight:600}
.slot{direction:ltr;width:min(100%,440px);min-height:40px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;text-align:center;color:var(--mut)}
.slot.f{border:2px solid var(--ok);color:var(--ink);background:color-mix(in srgb,var(--ok) 12%,transparent);font-weight:600}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none;outline:3px solid var(--bad)}}
.q{font-size:1.02rem;margin:8px 0;direction:ltr;text-align:left}
.opts{direction:ltr;display:grid;gap:8px}
.opts button{text-align:left}
.opts .r{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opts .w{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.bar{display:flex;justify-content:space-between;margin-top:10px;gap:8px;align-items:center}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .pri{color:#07261d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#07261d}}
.sc{overflow-x:auto;margin:8px 0}
svg.dg{min-width:760px;width:100%;height:auto;display:block;direction:ltr}
svg text{fill:var(--ink);font-size:16px;font-family:Segoe UI,Tahoma,system-ui,sans-serif;text-anchor:middle}
svg .sb{font-size:12.5px;fill:var(--mut)}
.nd{fill:var(--accbg);stroke:var(--acc);stroke-width:2}
.nd.h{fill:var(--hid);stroke:var(--line);stroke-dasharray:5 4}
.nd.t{stroke:var(--acc);stroke-width:4;stroke-dasharray:none}
g.hd{cursor:pointer}
.ed{fill:none;stroke:var(--acc);stroke-width:2}
.dc{fill:var(--hid);opacity:.55}
.dl{fill:none;stroke:var(--line);stroke-width:1.5}
marker path{fill:var(--acc)}
</style>
</head>
